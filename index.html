<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Schedule Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Student Schedule Planner 🧭</h1>
        <p>Automated Student Schedule Planner</p>
      </header>

      <div class="main-content">
        <!-- Form Section -->
        <div class="card form-card">
          <h2>Add New Course</h2>
          <form id="courseForm">
            <div class="form-group">
              <label for="courseCode">Course Code</label>
              <input
                type="text"
                id="courseCode"
                placeholder="Course Code (e.g. BSIT)"
                required
              />
            </div>

            <div class="form-group">
              <label for="dayOfWeek">Day of Week</label>
              <select id="dayOfWeek" required>
                <option value="" disabled selected>Select Day</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
              </select>
            </div>

            <div class="form-group">
              <label for="startTime">Start Time</label>
              <input type="time" id="startTime" required />
            </div>

            <div class="form-group">
              <label for="endTime">End Time</label>
              <input type="time" id="endTime" required />
            </div>

            <div class="form-group">
              <label for="room">Room Number</label>
              <input type="text" id="room" placeholder="Room Number" required />
            </div>

            <button type="submit" class="btn-submit">Save Course +</button>
            <p id="statusMessage" class="status-msg"></p>
          </form>
        </div>

        <!-- Table Section -->
        <div class="card table-card">
          <h2>Weekly Schedule Overview</h2>
          <table>
            <thead>
              <tr>
                <th>Course Code</th>
                <th>Day</th>
                <th>Time</th>
                <th>Room</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="scheduleList">
              <!-- Dynamic rows will appear here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Ginagamit na JS File -->
    <script src="Student Planner.js"></script>
  </body>
</html>
